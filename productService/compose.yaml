services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_app
    restart: unless-stopped
    environment:
      - APP_NAME=ProductService
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=http://${APP_URL:-localhost}
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "80:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - product_storage:/var/www/html/storage

  database:
    image: mysql:8.0
    container_name: product_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3306"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
    driver: local
  product_storage:
    driver: local